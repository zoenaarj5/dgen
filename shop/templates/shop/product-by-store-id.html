{% extends "shop/master.html" %}
{% block title %}<h3>{{title}}</h3>{% endblock %}
{% block content %}
   <table class="table table-dark">
    <tr><th scope="col">Nom</th><th scope="col">Description</th><th scope="col">Prix</th><th scope="col">En stock</th><th></th></tr>
        {% for prinst in productsInStore %}
        <tr>
            <th scope="row"><strong>{{prinst.product.name}}</strong></td>
            <td>{{prinst.product.description}}</td>
            <td>{{prinst.current_price}}</td>
            <td>{{prinst.quantity}}</td>
            <td><button type="button">Add to cart</button></td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
