{% extends "shop/master.html" %}
{% block title %}<h3>{{title}}</h3>{% endblock %}
{% block content %}
    <div><a href="/shop/add-product/">Ajouter un produit</a></div>
   <table class="table table-dark">
        <tr><th scope="col">Name</th><th scope="col">Description</th><th scope="col"></th></tr>
        {% for product in productz %}
        <tr>
            <th scope="row"><strong>{{product.name}}</strong></td>
            <td>{{product.description}}</td>
            <td><a href="/shop/products/{{product.id}}">Détail&nbsp;&gt;&gt;</a></td>
            <td><a href="/shop/edit-product/{{product.id}}">Modifier&nbsp;&gt;&gt;</a></td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
