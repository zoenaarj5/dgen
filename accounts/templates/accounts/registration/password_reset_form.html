{% extends 'accounts/master.html' %}
{% block title %}Réinitialisation du mot de passe{% endblock %}
{% block content %}
<p>Entrez votre adresse e-mail ci-dessous, un lien vous sera envoyé pour réinitialiser votre mot de passe.</p>
<form action="" method="POST" class="vk-form">
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit">Envoyer le lien</button>
</form>
{% endblock %}
