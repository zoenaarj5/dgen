{% extends 'accounts/master.html' %}
{% block title %}{{title}}{% endblock %}
{% block content %}
<div><a href="/accounts/add-account">Ajouter un utilisateur</a></div>
<table>
    <tr>
        <th>Email</th>
        <th>Phone nr</th>
    </tr>
    {% for user in users %}
        <tr>
            <td>
                {{user.email}}
            </td>
            <td>
                {{user.phone_number}}
            </td>
        </tr>
    {% endfor %}
</table>
{% endblock %}
